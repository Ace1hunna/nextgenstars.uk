<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Artist — Next Gen Stars</title>
  <meta name="description" content="Artist profile — Next Gen Stars.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #050505;
      --white: #f5f5f5;
      --grey: #999;
      --line: #202020;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 75px;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 75px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(5,5,5,.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
      transition: .2s;
    }

    .nav-links a:hover {
      color: white;
    }

    .profile {
      padding: 100px 7% 130px;
      border-bottom: 1px solid var(--line);
    }

    .back {
      display: inline-block;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 60px;
      transition: .2s;
    }

    .back:hover {
      color: white;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 80px;
      align-items: end;
    }

    .profile-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0b0b0b;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .profile-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
      font-size: clamp(80px, 15vw, 180px);
      font-weight: 900;
    }

    .profile-number {
      color: #555;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .profile-name {
      font-size: clamp(55px, 9vw, 130px);
      line-height: .82;
      letter-spacing: -7px;
      font-weight: 900;
      text-transform: uppercase;
      word-break: break-word;
    }

    .profile-meta {
      margin-top: 30px;
      color: #999;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .profile-bio {
      max-width: 650px;
      margin-top: 45px;
      color: #aaa;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.8;
    }

    .socials {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 45px;
    }

    .social {
      border: 1px solid #444;
      padding: 14px 20px;
      color: #aaa;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .25s;
    }

    .social:hover {
      border-color: white;
      color: white;
      background: #111;
    }

    .freestyles {
      padding: 100px 7% 130px;
    }

    .section-number {
      color: #555;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: clamp(50px, 8vw, 110px);
      line-height: .85;
      letter-spacing: -6px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 60px;
    }

    .track-list {
      border-top: 1px solid var(--line);
    }

    .track {
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
    }

    .track-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .track-number {
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .track-title {
      flex: 1;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    audio {
      width: 100%;
      height: 45px;
      filter: grayscale(1);
    }

    .empty,
    .error,
    .loading {
      padding: 80px 0;
      color: #777;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
    }

    footer {
      padding: 40px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid var(--line);
    }

    .footer-logo {
      color: white;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    @media (max-width: 800px) {

      .nav {
        padding: 0 5%;
      }

      .nav-links {
        gap: 14px;
      }

      .nav-links a {
        font-size: 9px;
      }

      .profile {
        padding: 80px 5% 90px;
      }

      .back {
        margin-bottom: 40px;
      }

      .profile-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .profile-name {
        letter-spacing: -4px;
      }

      .profile-bio {
        font-size: 17px;
      }

      .freestyles {
        padding: 80px 5% 90px;
      }

      .section-title {
        letter-spacing: -4px;
      }

      .track-top {
        align-items: flex-start;
      }

      .track-title {
        font-size: 20px;
      }

      footer {
        padding: 30px 5%;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">NGS★</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="index.html#vision">Vision</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </nav>

  <main>

    <section class="profile">

      <a href="artists.html" class="back">
        ← Back to Artists
      </a>

      <div id="profile">
        <div class="loading">
          Loading artist...
        </div>
      </div>

    </section>

    <section class="freestyles">

      <div class="section-number">
        01 / FREESTYLES
      </div>

      <h2 class="section-title">
        Hear<br>
        Them.
      </h2>

      <div id="tracks" class="track-list">
        <div class="loading">
          Loading freestyles...
        </div>
      </div>

    </section>

  </main>

  <footer>
    <div class="footer-logo">NGS★</div>
    <div>© 2026 Next Gen Stars</div>
    <div>London, UK</div>
  </footer>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.NGS_CONFIG.url,
      window.NGS_CONFIG.publishableKey
    );

    const profileContainer = document.getElementById("profile");
    const tracksContainer = document.getElementById("tracks");

    const params = new URLSearchParams(window.location.search);
    const artistId = params.get("id");

    async function loadArtist() {

      if (!artistId) {
        profileContainer.innerHTML = `
          <div class="error">
            No artist was selected.
          </div>
        `;

        tracksContainer.innerHTML = `
          <div class="empty">
            No artist was selected.
          </div>
        `;

        return;
      }

      const { data: artist, error } = await supabaseClient
        .from("artists")
        .select("*")
        .eq("id", artistId)
        .eq("published", true)
        .single();

      if (error || !artist) {

        console.error(error);

        profileContainer.innerHTML = `
          <div class="error">
            Artist not found.
          </div>
        `;

        tracksContainer.innerHTML = `
          <div class="empty">
            No freestyles available.
          </div>
        `;

        return;
      }

      renderArtist(artist);
      loadFreestyles(artist.id);

      document.title = `${artist.name} — Next Gen Stars`;
    }

    function renderArtist(artist) {

      const meta = [
        artist.area,
        artist.age ? `${artist.age} YEARS` : ""
      ].filter(Boolean).join(" / ");

      const image = artist.image_url
        ? `
          <div class="profile-image-wrap">
            <img
              src="${escapeHtml(artist.image_url)}"
              class="profile-image"
              alt="${escapeHtml(artist.name)}"
            >
          </div>
        `
        : `
          <div class="profile-image-wrap">
            <div class="no-image">
              ★
            </div>
          </div>
        `;

      const socials = [];

      if (artist.tiktok) {
        socials.push(
          `<a href="${safeUrl(artist.tiktok)}" target="_blank" rel="noopener noreferrer" class="social">TikTok</a>`
        );
      }

      if (artist.instagram) {
        socials.push(
          `<a href="${safeUrl(artist.instagram)}" target="_blank" rel="noopener noreferrer" class="social">Instagram</a>`
        );
      }

      if (artist.soundcloud) {
        socials.push(
          `<a href="${safeUrl(artist.soundcloud)}" target="_blank" rel="noopener noreferrer" class="social">SoundCloud</a>`
        );
      }

      if (artist.spotify) {
        socials.push(
          `<a href="${safeUrl(artist.spotify)}" target="_blank" rel="noopener noreferrer" class="social">Spotify</a>`
        );
      }

      if (artist.youtube) {
        socials.push(
          `<a href="${safeUrl(artist.youtube)}" target="_blank" rel="noopener noreferrer" class="social">YouTube</a>`
        );
      }

      profileContainer.innerHTML = `
        <div class="profile-grid">

          ${image}

          <div>

            <div class="profile-number">
              NGS / ARTIST
            </div>

            <h1 class="profile-name">
              ${escapeHtml(artist.name)}
            </h1>

            <div class="profile-meta">
              ${escapeHtml(meta || "NGS ARTIST")}
            </div>

            ${
              artist.bio
                ? `
                  <p class="profile-bio">
                    ${escapeHtml(artist.bio)}
                  </p>
                `
                : ""
            }

            ${
              socials.length
                ? `
                  <div class="socials">
                    ${socials.join("")}
                  </div>
                `
                : ""
            }

          </div>

        </div>
      `;
    }

    async function loadFreestyles(artistId) {

      const { data, error } = await supabaseClient
        .from("freestyles")
        .select("*")
        .eq("artist_id", artistId)
        .eq("published", true)
        .order("created_at", { ascending: false });

      if (error) {

        console.error(error);

        tracksContainer.innerHTML = `
          <div class="error">
            Something went wrong loading the freestyles.
          </div>
        `;

        return;
      }

      renderFreestyles(data || []);
    }

    function renderFreestyles(tracks) {

      if (!tracks.length) {

        tracksContainer.innerHTML = `
          <div class="empty">
            No freestyles have been published yet.
          </div>
        `;

        return;
      }

      tracksContainer.innerHTML = tracks.map((track, index) => {

        return `
          <div class="track">

            <div class="track-top">

              <div class="track-number">
                ${String(index + 1).padStart(2, "0")}
              </div>

              <div class="track-title">
                ${escapeHtml(track.title)}
              </div>

            </div>

            <audio controls preload="none">
              <source
                src="${escapeHtml(track.audio_url)}"
              >
              Your browser does not support audio playback.
            </audio>

          </div>
        `;

      }).join("");
    }

    function safeUrl(value) {

      const url = String(value || "").trim();

      if (
        url.startsWith("https://") ||
        url.startsWith("http://")
      ) {
        return escapeHtml(url);
      }

      return "#";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadArtist();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Gen Stars</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .hero {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8%;
      position: relative;
      overflow: hidden;
    }

    .hero h1 {
      font-size: clamp(60px, 12vw, 150px);
      line-height: 0.85;
      font-weight: 900;
      letter-spacing: -7px;
      text-transform: uppercase;
      max-width: 1000px;
    }

    .hero p {
      margin-top: 35px;
      max-width: 500px;
      color: #aaa;
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 35px;
      width: fit-content;
      padding: 15px 28px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
      font-size: 13px;
      transition: 0.2s;
    }

    .button:hover {
      background: white;
      color: black;
    }

    .tag {
      position: absolute;
      right: 7%;
      bottom: 8%;
      color: #555;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 5%;
      }

      nav a {
        margin-left: 12px;
        font-size: 11px;
      }

      .hero {
        padding: 10% 5%;
      }

      .hero h1 {
        letter-spacing: -4px;
      }

      .hero p {
        font-size: 16px;
      }

      .tag {
        right: 5%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NGS★</div>

    <nav>
      <a href="#">Artists</a>
      <a href="#">Videos</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Next<br>Gen<br>Stars</h1>

    <p>
      A platform built for the next generation of artists,
      creators and stars.
    </p>

    <a href="#" class="button">Discover NGS</a>

    <div class="tag">Est. 2026 — London</div>
  </main>

</body>
</html>
